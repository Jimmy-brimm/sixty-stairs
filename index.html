<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Pixel Dungeon: The Sixty Stairs. A top-down pixel crawler sixty floors deep, alone or with friends."><script>window.SIXTY_SITE = 1</script></head><body><title>The Sixty Stairs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0a14; --panel: rgba(20, 14, 28, 0.92); --line: #5a4678; --ink: #e8e0f0; --dim: #a89cc0; --gold: #ffce46;
    --pad: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.45 ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .veil { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--pad); background: var(--bg); text-align: center; transition: opacity 0.45s ease; }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil h1 { margin: 0 0 6px; color: var(--gold); font-size: clamp(22px, 6vw, 40px); letter-spacing: 0.08em; text-shadow: 3px 3px 0 #3a1a10; }
  .veil p { margin: 0 0 16px; color: var(--dim); }
  .bar { width: min(260px, 70vw); height: 10px; margin: 0 auto; border: 2px solid var(--line); background: #1a1224; }
  .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
  #err { color: #ff8070; white-space: pre-wrap; max-width: 640px; margin-top: 14px; }
  #tools { position: fixed; top: 40%; right: 0; padding: 0 max(6px, env(safe-area-inset-right)) 0 0; display: flex; flex-direction: column; gap: 6px; }
  #tools button { width: 30px; height: 30px; border: 2px solid var(--line); background: var(--panel); color: var(--dim);
    font: inherit; font-weight: 700; cursor: pointer; opacity: 0.7; }
  #tools button:hover, #tools button:focus-visible { opacity: 1; color: var(--gold); border-color: var(--gold); outline: none; }
  #help { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--pad); pointer-events: none; }
  #help > div { pointer-events: auto; max-width: 420px; padding: 12px 14px; border: 2px solid var(--line); background: var(--panel); }
  #help h2 { margin: 0 0 6px; font-size: 14px; color: var(--gold); }
  #help p { margin: 0 0 8px; }
  #help p:last-child { margin: 0; color: var(--dim); }
  #xferBar { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 8px; }
  #xferBar button, #xferGo { font: inherit; font-size: 13px; padding: 4px 10px; border: 2px solid var(--line); background: #1a1224; color: var(--ink); cursor: pointer; }
  #xferBar button:hover, #xferGo:hover { border-color: var(--gold); color: var(--gold); }
  #xferText { width: 100%; box-sizing: border-box; height: 70px; font: 11px/1.3 ui-monospace, Consolas, monospace; background: #0b0810; color: var(--ink); border: 2px solid var(--line); padding: 6px; resize: vertical; }
  #xferMsg { display: block; margin-top: 6px; color: var(--gold); }
  #stick { position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.18); background: rgba(20, 14, 28, 0.35);
    touch-action: none; display: grid; place-items: center; }
  #stick i { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 206, 70, 0.35); border: 2px solid rgba(255, 206, 70, 0.6); }
  [hidden] { display: none !important; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>

<canvas id="game" tabindex="0" aria-label="The Sixty Stairs, a pixel dungeon crawler"></canvas>
<div id="stick" hidden aria-hidden="true"><i></i></div>
<div id="tools">
  <button id="helpBtn" title="How to play" aria-expanded="false">?</button>
  <button id="fsBtn" title="Full screen">&#x26F6;</button>
</div>
<div id="help" hidden>
  <div>
    <h2>HOW TO PLAY</h2>
    <p id="helpText"></p>
    <p id="coopText"></p>
    <p id="saveText"></p>
    <div id="xferBar"><button id="saveOut">Copy my save</button><button id="saveIn">Load a save</button></div>
    <div id="xfer" hidden><textarea id="xferText" spellcheck="false" aria-label="Save code"></textarea><button id="xferGo" hidden>Load it</button><span id="xferMsg"></span></div>
  </div>
</div>
<div class="veil" id="veil">
  <div>
    <h1>THE SIXTY STAIRS</h1>
    <p>sixty floors down to the demon lord</p>
    <div class="bar"><i id="barFill"></i></div>
    <div id="err"></div>
  </div>
</div>

<script type="module">
  import { createP0 } from './p0.js'
  const $ = id => document.getElementById(id)
  const step = f => { $('barFill').style.width = Math.round(f * 100) + '%' }
  const fail = e => { $('err').textContent = 'The game could not start.\n' + (e?.message || e); console.error(e) }
  addEventListener('error', e => { if (!$('veil').hidden) fail(e.error || e.message) })

  const help = $('help'), helpBtn = $('helpBtn')
  let coopLine = () => ''
  const showHelp = on => { if (on) $('coopText').textContent = coopLine(); help.hidden = !on; helpBtn.setAttribute('aria-expanded', String(on)); if (!on) $('game').focus({ preventScroll: true }) }
  helpBtn.onclick = () => showHelp(help.hidden)
  const fsBtn = $('fsBtn')
  if (!document.fullscreenEnabled) fsBtn.hidden = true
  fsBtn.onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen() } catch {} ; $('game').focus({ preventScroll: true }) }

  try {
    step(0.1)
    const p0 = await createP0({ canvas: $('game'), stick: $('stick'), base: 'game/', saveKey: 'sixty-stairs-save' })
    globalThis.sixtyStairs = p0          // for the local checks (artifact/check.mjs)
    p0.on('hud', text => { $('helpText').innerText = text.replace(/ · /g, '  ·  ') })
    step(0.35)
    const { default: start } = await import('./game/main.js')
    step(0.6)
    await start(p0)
    step(1)
    $('saveText').textContent = (p0.saveWhere === 'account'
      ? 'Your three save files are kept with your Claude account (and in this browser). '
      : 'Your three save files are kept in this browser. ')

    // moving a save: Copy shows the code (and copies it); Load takes one, asks once more, then reloads
    const xfer = $('xfer'), xt = $('xferText'), xm = $('xferMsg'), go = $('xferGo')
    let armed = false
    $('saveOut').onclick = async () => {
      const code = p0.exportSave()
      xfer.hidden = false; go.hidden = true; armed = false
      if (!code) { xt.value = ''; xm.textContent = 'There is no save here yet.'; return }
      xt.value = code; xt.select()
      let copied = false
      try { await navigator.clipboard.writeText(code); copied = true } catch {}
      xm.textContent = (copied ? 'Copied. ' : 'Select it all and copy it. ') + 'On the other page, press ?, then Load a save, and paste it there.'
      const short = await p0.exportShort()
      if (short) xm.textContent += ' For Project 0, type this code in Save Files (T, Type in a code): ' + short + ' (the file in use; the bag stays behind).'
    }
    $('saveIn').onclick = () => { xfer.hidden = false; go.hidden = false; armed = false; xt.value = ''; xm.textContent = 'Paste your save code, or type a transfer code from Project 0, then press Load it.'; xt.focus() }
    go.onclick = async () => {
      if (!armed) { armed = true; xm.textContent = 'This replaces all three save files on this page. Press Load it again to go ahead.'; return }
      const err = await p0.importSave(xt.value)
      if (err) { armed = false; xm.textContent = err; return }
      xm.textContent = 'Loaded. Starting again with your save...'
      setTimeout(() => location.reload(), 600)
    }
    coopLine = () => (p0.coop ? 'Co-op is connected: ' + Math.max(0, p0.room.players.length - 1) + ' other player(s) have the game open now. Pick Play Together.' : 'Co-op: ' + p0.coopWhy + '.')
      + (p0.party ? ' Room: ' + p0.party + '. For a private party, add ?party=yourname to the address and share it.' : '')
    // the loading screen fades out over the game's own fade up from black
    $('veil').classList.add('gone'); $('game').focus({ preventScroll: true })
    setTimeout(() => { $('veil').hidden = true }, 500)
  } catch (e) { fail(e) }
</script>
</body></html>
